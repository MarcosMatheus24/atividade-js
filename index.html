<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cálculo de IMC</title>
</head>
<body>
    <div class="container">
        <h1>CÁLCULO DE IMC</h1>
        <form id="imcForm">
            <p>Peso (kg)</p>
            <input type="number" step="0.1" placeholder="Ex: 70.5" id="peso" required>
            
            <p>Altura (cm)</p>
            <input type="number" placeholder="Ex: 175" id="altura" required>
            
            <br>
            <button type="button" id="btn">Calcular</button>
        </form>

        <!-- Elemento onde o resultado do innerHTML será exibido -->
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
